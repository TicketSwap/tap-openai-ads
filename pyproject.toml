[build-system]
requires = [
    "hatchling>=1,<2",
    "hatch-vcs>=0.5",
]
build-backend = "hatchling.build"

[project]
name = "tap-openai-ads"
dynamic = ["version"]
description = "Singer tap for OpenAI (ChatGPT) Ads, built with the Meltano Singer SDK."
readme = "README.md"
authors = [{ name = "Jakob Chumtong", email = "jakob.chumtong@ticketswap.com" }]
keywords = [
    "ELT",
    "OpenAI Ads",
    "ChatGPT Ads",
]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
license = "Apache-2.0"
license-files = [ "LICENSE" ]
requires-python = ">=3.10,<3.13"
dependencies = [
    "singer-sdk~=0.54.9",
    "typing-extensions>=4.16.0; python_version < '3.12'",
]

[project.scripts]
tap-openai-ads = 'tap_openai_ads.tap:TapOpenAIAds.cli'

[dependency-groups]
dev = [
    { include-group = "test" },
]
test = [
    "pytest>=9.1.1",
    "pytest-github-actions-annotate-failures>=0.4.2",
    "requests-mock>=1.12.1",
]

[tool.hatch.version]
fallback-version = "0.1.0.dev0"
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["tap_openai_ads"]

[tool.pytest]
addopts = [
    "-ra",
]
log_level = "INFO"
minversion = "9"
testpaths = [
    "tests",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
    "COM812",
    "D",
]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S101", "INP001", "PLR2004"]
